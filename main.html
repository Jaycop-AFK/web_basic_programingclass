<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASD Controller</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .control-status { font-size: 20px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>ESP32 WASD Controller</h1>
    <p>Use WASD keys to control the joystick. </p>
    <div class="control-status">Current Direction: <span id="direction">None</span></div>

    <script>
        let webSocket;
        let joystickX = 255, joystickY = 255; // Neutral position

        function connectWebSocket() {
            webSocket = new WebSocket('ws://kukukai2000.ddns.net:88/');

            webSocket.onopen = function () {
                console.log('WebSocket connected');
            };

            webSocket.onmessage = function (event) {
                console.log('Message from server: ' + event.data);
            };

            webSocket.onclose = function () {
                console.log('WebSocket disconnected');
            };
        }

        function sendJoystickData() {
            if (webSocket && webSocket.readyState === WebSocket.OPEN) {
                const joystickData = {
                    x: joystickX,
                    y: joystickY
                };
                webSocket.send(0x01,JSON.stringify(joystickData));
            }
        }

        document.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            let direction = "None";

            if (key === 'w') {
                joystickY = 11; // Move up
                direction = 'Up';
            } else if (key === 's') {
                joystickY = 0; // Move down
                direction = 'Down';
            } else if (key === 'a') {
                joystickX =11; // Move left
                direction = 'Left';
            } else if (key === 'd') {
                joystickX =0; // Move right
                direction = 'Right';
            }

            // Update the displayed direction and send data
            document.getElementById('direction').textContent = direction;
            sendJoystickData();
        });

        connectWebSocket();
    </script>
</body>
</html>
